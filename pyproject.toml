[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "pybind11>=2.12.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "alakoro-fibersense"
version = "2.11.0"
description = "Alakoro FiberSense — Plataforma Open-Source Multi-Modal para DFOS em Poços de Petróleo / Open-Source Multi-Modal Platform for DFOS in Oil & Gas Wells"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Luiz Paulo Colombiano"}
]
maintainers = [
    {name = "Luiz Paulo Colombiano"}
]
keywords = [
    "dfos", "das", "dts", "dss", "fiber-optic", "oil-gas", "petroleum",
    "well-monitoring", "distributed-sensing", "frac", "cementing",
    "joule-thomson", "lf-das", "exdts", "fibersense", "alakoro"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: English",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "xarray>=0.19.0",
    "pytest>=7.0.0",
    "rdflib>=7.0.0",
    "dascore>=0.1.20",
    "h5py>=3.7.0",
    "obspy>=1.3.0",
    "xdas>=0.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
    "PyQtGraph>=0.13.0",
    "qdarkstyle>=3.0.0",
]
dev = [
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "pytest-qt>=4.2.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/Colombiano/Alakoro_FiberSense"
Documentation = "https://github.com/Colombiano/Alakoro_FiberSense/blob/main/USER_GUIDE.md"
Repository = "https://github.com/Colombiano/Alakoro_FiberSense.git"
Issues = "https://github.com/Colombiano/Alakoro_FiberSense/issues"
Changelog = "https://github.com/Colombiano/Alakoro_FiberSense/blob/main/CHANGELOG.md"

[project.scripts]
alakoro = "src.__init__:main"
alakoro-gui = "src.__init__:main_gui"

[project.entry-points."alakoro.driver"]
example_vendor = "src.io.drivers.optional.example_vendor:ExampleVendorDriver"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "alakoro_core*"]
exclude = ["tests*", "install*", "docs*"]

[tool.setuptools.package-data]
"src.events" = ["*.json"]

[tool.scikit-build]
cmake.source-dir = "src/cpp"
cmake.build-type = "Release"
wheel.packages = ["alakoro_core", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --color=yes"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 120
ignore = ["E501", "W503"]
