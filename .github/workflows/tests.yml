# ═══════════════════════════════════════════════════════════════════
# Alakoro FiberSense — CI: Testes e Validacao
# CI: Tests and Validation
# ═══════════════════════════════════════════════════════════════════

name: 🧪 Testes / Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Testar em Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      # ─── Checkout ───
      - name: 📥 Checkout do codigo
        uses: actions/checkout@v4

      # ─── Setup Python ───
      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ─── Cache pip ───
      - name: 💾 Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
            ${{ runner.os }}-pip-

      # ─── Dependencias do sistema ───
      - name: 🔧 Instalar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            protobuf-compiler \
            libprotobuf-dev

      # ─── Instalar dependencias Python ───
      - name: 📦 Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─── Instalar pacote com extensao C++ e Protobuf ───
      - name: 🔨 Build e instalacao editable (inclui C++20 + Protobuf)
        run: |
          pip install -e . --no-build-isolation \
            --config-settings=cmake.define.ALAKORO_WITH_PROTOBUF=ON

      # ─── Validar importacao ───
      - name: ✅ Validar importacao dos modulos
        run: |
          python -c "import alakoro_core; print('alakoro_core OK')"
          python -c "from src.io.alakoro_spool import AlakoroPatch; print('AlakoroPatch OK')"
          python -c "from src.gui.main_window import AlakoroMainWindow; print('GUI OK')"

      # ─── Executar testes ───
      - name: 🧪 Executar pytest
        run: |
          pytest tests/ -v --tb=short --color=yes

      # ─── Cobertura de codigo ───
      - name: 📊 Gerar cobertura
        if: matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          pytest tests/ --cov=src --cov-report=xml --cov-report=term

      # ─── Upload cobertura ───
      - name: ⬆️  Enviar cobertura para Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: 🔍 Lint e Formatacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 💾 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-lint-pip-${{ hashFiles('pyproject.toml') }}
      - name: 📦 Instalar ferramentas de lint
        run: pip install flake8 black
      - name: 🔍 Verificar estilo (flake8)
        run: flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503
      - name: 🎨 Verificar formatacao (black)
        run: black --check src/ tests/

  build:
    name: 📦 Build do pacote / Package build
    runs-on: ubuntu-latest
    needs: test
    steps:
      # ─── Checkout ───
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ─── Setup Python ───
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── Dependencias do sistema ───
      - name: 🔧 Instalar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            protobuf-compiler \
            libprotobuf-dev

      # ─── Instalar build backend ───
      - name: 📦 Instalar build backend
        run: |
          python -m pip install --upgrade pip
          pip install build scikit-build-core pybind11 ninja

      # ─── Build do pacote ───
      - name: 🔨 Executar python -m build
        run: |
          python -m build \
            --config-setting=cmake.define.ALAKORO_WITH_PROTOBUF=ON

      # ─── Upload artifact ───
      - name: ⬆️  Upload do artefato de distribuicao
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
